<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Explorer</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container py-5">

        <header class="text-center mb-3">
            <h1>Book Explorer</h1>
            <p class="lead fst-italic">
                Discover your next read.
            </p>
        </header>

        <section aria-label="Book search" class="text-center google-search">

            <form id="search-form" class="search-form">

                <div class="mb-3">
                    <label for="search-input" class="form-label visually-hidden">
                        Enter a book title or subject
                    </label>

                    <input
                        type="text"
                        class="form-control google-input"
                        id="search-input"
                        name="search"
                        placeholder="Search books, e.g JavaScript"
                        maxlength="50"
                        required
                    >

                    <div id="search-input-feedback" class="invalid-feedback">
                        Enter at least one character to search.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary shadow-sm rounded-pill">
                    Search Books
                </button>

                <button type="button" id="reset-search" class="btn btn-light border shadow-sm rounded-pill">
                    Reset
                </button>

            </form>

            <div id="search-status" class="visually-hidden mt-3" aria-live="polite"></div>

        </section>

        <section
            class="mt-3"
            aria-label="Search results"
        >

            <div id="results" class="row g-4">
                <!-- Books are added here with JavaScript -->
            </div>

            <nav class="d-flex justify-content-center align-items-center gap-3 mt-4 pagination-bar" aria-label="Results pagination">
                <button id="first-page" type="button" class="btn btn-primary" aria-label="First page" disabled>
                    «
                </button>
                <button id="prev-page" type="button" class="btn btn-primary" aria-label="Previous page" disabled>
                    ‹
                </button>
                <span id="page-info" class="text-muted"></span>
                <button id="next-page" type="button" class="btn btn-primary" aria-label="Next page" disabled>
                    ›
                </button>
                <button id="last-page" type="button" class="btn btn-primary" aria-label="Last page" disabled>
                    »
                </button>
            </nav>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
