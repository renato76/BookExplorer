<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Explorer</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="container py-5">

        <header class="text-center mb-5">
            <h1>Book Explorer</h1>
            <p class="lead">
                Search for books and discover your next read.
            </p>
        </header>

        <section aria-labelledby="search-heading">

            <h2 id="search-heading" class="h3 mb-3">
                Search for a book
            </h2>

            <form id="search-form">

                <div class="mb-3">
                    <label for="search-input" class="form-label">
                        Enter a book title or subject
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="search-input"
                        name="search"
                        placeholder="e.g. JavaScript"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Search Books
                </button>

            </form>

        </section>

        <section
            class="mt-5"
            aria-labelledby="results-heading"
        >

            <h2 id="results-heading" class="h3 mb-4">
                Results
            </h2>

            <div id="results" class="row g-4">
                <!-- Books are added here with JavaScript -->
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
